# Targets trust the Vault SSH CA and get the svc_aap account. Additive: other logins keep working.
# Credentials: homelab-labadmin
- name: Read the CA public key from Vault
  hosts: vault
  gather_facts: false
  vars_files:
    - ../vars/lab.yml
  tasks:
    - name: CA public key (unauthenticated endpoint)
      ansible.builtin.uri:
        url: "https://127.0.0.1:8200/v1/{{ vault_ssh_mount }}/public_key"
        ca_path: /opt/vault/tls/vault.crt
        return_content: true
      register: ssh_ca

    - name: Looks like a public key
      ansible.builtin.assert:
        that: ssh_ca.content is match('^(ssh-|ecdsa-)')

- name: Trust the CA on the targets
  hosts: rhel_targets
  become: true
  vars_files:
    - ../vars/lab.yml
  vars:
    ssh_ca_file: /etc/ssh/trusted-user-ca-keys.pem
  tasks:
    - name: Service account for AAP
      ansible.builtin.user:
        name: "{{ aap_ssh_user }}"
        shell: /bin/bash
        password_lock: true

    - name: Sudo for the service account
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ aap_ssh_user }}"
        content: "{{ aap_ssh_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: CA public key
      ansible.builtin.copy:
        dest: "{{ ssh_ca_file }}"
        content: "{{ hostvars[groups['vault'][0]].ssh_ca.content | trim }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: reload sshd

    - name: sshd trusts the CA (above any Match block)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*TrustedUserCAKeys\s'
        line: "TrustedUserCAKeys {{ ssh_ca_file }}"
        insertbefore: '^Match\s'
        firstmatch: true
        validate: sshd -t -f %s
      notify: reload sshd

  handlers:
    - name: reload sshd
      ansible.builtin.systemd:
        name: sshd
        state: reloaded
