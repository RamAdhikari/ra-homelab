# Lab inventory. Clones are on DHCP and not in DNS, so addresses are pinned here.
# If a lease changes, update ansible_host (terraform output vm_ips shows current IPs).
# Login: labadmin with your SSH key (ssh-copy-id first), passwordless sudo.
[vault]
lab-vault01.homelab.local ansible_host=192.168.1.29

[rhel_targets]
lab-rhel01.homelab.local ansible_host=192.168.1.27
lab-rhel02.homelab.local ansible_host=192.168.1.28

[all:vars]
ansible_user=labadmin
vault_addr=https://lab-vault01.homelab.local:8200
